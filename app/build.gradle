plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbik.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.orbik.launcher"
        minSdk 21
        targetSdk 33
        versionCode 1000
        versionName "10.0 Cinnamon Bun"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
}
