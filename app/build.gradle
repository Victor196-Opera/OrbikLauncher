plugins {
    id 'com.android.application' version '8.2.0' apply true
}

android {
    namespace 'com.orbik.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.orbik.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}